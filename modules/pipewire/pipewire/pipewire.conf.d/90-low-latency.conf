# Force the graph to always run with a quantum (period size) of 256 samples,
# matching the 2x256-sample ALSA buffering configured in
# wireplumber/wireplumber.conf.d/90-alsa-config.conf. At 48kHz this results
# in a consistent ~5.3ms of latency per period.
context.properties = {
    default.clock.quantum       = 256
    default.clock.min-quantum   = 256
    default.clock.max-quantum   = 256
}
